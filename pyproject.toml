[project]
name = "incident-ai-backend"
version = "1.0.0"
description = "Incident triage, assistive analysis, timelines, and postmortems"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1", "aiosqlite>=0.20,<1", "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3", "httpx[http2]>=0.27,<1", "redis>=5,<7",
  "celery[redis]>=5.4,<6", "pgvector>=0.3,<1", "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.28,<2", "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
  "boto3>=1.35,<2", "PyJWT[crypto]>=2.10,<3", "cryptography>=44",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.9,<1", "black>=25,<27", "mypy>=1.14,<2", "testcontainers[postgres]>=4.9,<5", "types-boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*", "pgvector.*", "testcontainers.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: requires TEST_POSTGRES_URL or RUN_POSTGRES_TESTS=1 with Docker"]
