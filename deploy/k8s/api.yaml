apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-ai-api
  namespace: incident-ai
spec:
  replicas: 2
  selector:
    matchLabels: {app: incident-ai-api}
  template:
    metadata:
      labels: {app: incident-ai-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: incident-ai:release
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef: {name: incident-ai-config}
            - secretRef: {name: incident-ai-secrets}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: incident-ai-api
  namespace: incident-ai
spec:
  selector: {app: incident-ai-api}
  ports: [{name: http, port: 8000, targetPort: 8000}]
