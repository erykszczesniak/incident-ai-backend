# Copy outside the repository, replace values, then apply. Prefer a secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: incident-ai-secrets
  namespace: incident-ai
type: Opaque
stringData:
  API_KEY: REPLACE_WITH_RANDOM_SECRET
  WEBHOOK_KEY: REPLACE_WITH_DIFFERENT_RANDOM_SECRET
  DATABASE_URL: postgresql+asyncpg://USER:PASSWORD@POSTGRES_HOST:5432/incident_ai
  REDIS_URL: rediss://USER:PASSWORD@REDIS_HOST:6379/0
  OPENAI_API_KEY: REPLACE_WITH_PROVIDER_KEY
  LLM_MODEL: REPLACE_WITH_SUPPORTED_MODEL
